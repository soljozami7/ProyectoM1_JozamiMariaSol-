<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de colores</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main>
        <h1>Paleta de colores</h1>
    </main>
     <!--controles-->
    <div class="controles" style="border: 1px solid black; padding: 10px; margin: 10px;">
       <label for="select-cantidad">Cantidad de colores:</label>  
       <select id="select-cantidad">
            <option value = '6'>6 colores</option>
            <option value = '8'>8 colores</option>
            <option value = '9'>9 colores</option>
       </select>
       <label for="formato-color">Formato de Color:</label>
       <select id="formato-color" > 
        <option value="hex">HEX</option> 
        <option value="hsl">HSL</option>
       </select>
        
       <button id="btn-generar">GENERAR PALETA</button>
                  </div>

<!--Paleta de colores-->
    <div class ="contenedor-paleta"></div>
    <p id="mensaje"></p>
    
    <script src="app.js"></script>
</body>
</html>
